# -----------------------------------------------------------------------------
# Environnement de dev pour faire tourner les demos Blapy2.
#
#   docker compose up
#     -> LISTE des demos (page d'accueil) : http://localhost:8080/demos/
#     -> une demo précise                 : http://localhost:8080/demos/<nom>/
#     -> serveur websocket                : ws://localhost:8081
#
# Prérequis : le bundle doit être construit au moins une fois (`pnpm build`),
# les demos migrées chargent ../../dist/blapy.umd.js.
# -----------------------------------------------------------------------------

services:
  # Sert tout le repo (demos + dist + lib) avec PHP.
  # Le document root est la racine du repo pour que les chemins relatifs
  # ../../dist/ et ../../lib/ des demos résolvent correctement.
  web:
    image: php:8.3-apache
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    restart: unless-stopped

  # Serveur websocket (demos/websocket). Optionnel : utile seulement
  # pour la demo websocket. Installe `ws` au démarrage puis lance le serveur.
  websocket:
    image: node:20-alpine
    ports:
      - "8081:8081"
    volumes:
      - .:/app
    working_dir: /app
    # Install `ws` from the demo's own minimal package.json (avoids resolving the
    # whole repo's devDependencies, which conflict — ERESOLVE — and crash-loop).
    command: sh -c "cd demos/websocket && npm install && node server.js"
    restart: unless-stopped